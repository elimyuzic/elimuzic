<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELIMYUZIC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      height: 60px;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid #282828;
    }

    .brand-logo {
      color: #1db954;
      font-size: 1.5rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }

    .search-container {
      display: flex;
      align-items: center;
      background-color: #242424;
      border-radius: 50px;
      padding: 6px 16px;
      width: 320px;
    }

    .search-container input {
      background: transparent;
      border: none;
      color: #ffffff;
      width: 100%;
      outline: none;
      padding-right: 8px;
    }

    .search-btn {
      background: #1db954;
      border: none;
      color: black;
      border-radius: 20px;
      padding: 6px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 220px;
      background-color: #121212;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-item {
      color: #b3b3b3;
      font-weight: bold;
      cursor: pointer;
      padding: 8px;
      border-radius: 4px;
    }

    .nav-item:hover, .nav-item.active {
      color: #ffffff;
      background-color: #282828;
    }

    .content-area {
      flex: 1;
      background: linear-gradient(to bottom, #1e1e1e, #121212);
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .media-card {
      background-color: #181818;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .media-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
    }

    .media-card .title {
      font-size: 0.85rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-card .sub-title {
      font-size: 0.75rem;
      color: #b3b3b3;
    }

    .btn-action {
      background-color: #1db954;
      border: none;
      color: black;
      font-weight: bold;
      padding: 6px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.75rem;
      margin-top: 4px;
    }

    .player-view {
      width: 100%;
      height: 250px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    iframe { width: 100%; height: 100%; border: none; }

    .player-bar {
      height: 80px;
      background-color: #181818;
      border-top: 1px solid #282828;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .now-playing img {
      width: 50px;
      height: 50px;
      border-radius: 4px;
      object-fit: cover;
      background: #282828;
    }

    .track-info .track-title {
      font-size: 0.85rem;
      font-weight: bold;
    }

    .track-info .track-artist {
      font-size: 0.75rem;
      color: #b3b3b3;
    }

    #adminModal {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background-color: #282828;
      padding: 20px;
      border-radius: 12px;
      z-index: 1000;
      width: 300px;
      border: 1px solid #1db954;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand-logo" onclick="handleSecretClick()">ELIMYUZIC</div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="חפש שיר או אמן...">
      <button class="search-btn" onclick="searchYoutube()">חפש</button>
    </div>
    <div></div>
  </div>

  <div class="main-layout">
    <div class="sidebar">
      <div class="nav-item active" onclick="showSection('results')">תוצאות חיפוש</div>
      <div class="nav-item" onclick="showSection('playlist')">הפלייליסט שלי</div>
    </div>

    <div class="content-area">
      <div class="player-view" id="playerContainer">
        <p style="color: #b3b3b3;">בחר שיר מתוך הרשימה למטה</p>
      </div>

      <div id="resultsSection">
        <h3 style="margin-bottom: 12px;">תוצאות מוזיקה</h3>
        <div class="grid-container" id="resultsGrid"></div>
      </div>

      <div id="playlistSection" style="display: none;">
        <h3 style="margin-bottom: 12px;">הפלייליסט שלי</h3>
        <div class="grid-container" id="playlistGrid"></div>
      </div>
    </div>
  </div>

  <div class="player-bar">
    <div class="now-playing">
      <img id="barThumb" src="" alt="" style="display:none;">
      <div class="track-info">
        <div class="track-title" id="barTitle">אין שיר מופעל</div>
        <div class="track-artist" id="barArtist">בחר שיר להשמעה</div>
      </div>
    </div>
  </div>

  <div id="adminModal">
    <h3 style="margin-bottom: 10px; color: #1db954;">פאנל מנהל</h3>
    <input type="file" id="adFileInput" accept="image/*" style="margin-bottom: 10px; width: 100%;">
    <button class="search-btn" style="width: 100%;" onclick="uploadAd()">העלה פרסומת</button>
    <button class="search-btn" style="width: 100%; background: #444; color: white; margin-top: 5px;" onclick="closeAdmin()">סגור</button>
  </div>

  <script>
    const YOUTUBE_API_KEY = 'AIzaSyDciIRdNamQuthn579qKWTM9CqXSyQzO7c';
    let clickCount = 0;
    let clickTimer = null;
    let adminToken = '';
    let myPlaylist = JSON.parse(localStorage.getItem('elim_playlist')) || [];

    function handleSecretClick() {
      clickCount++;
      clearTimeout(clickTimer);

      if (clickCount === 6) {
        clickCount = 0;
        const code = prompt('הכנס קוד מנהל:');
        if (code === '1059') {
          adminToken = code;
          document.getElementById('adminModal').style.display = 'block';
        } else if (code) {
          alert('קוד שגוי');
        }
      } else {
        clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
      }
    }

    function closeAdmin() {
      document.getElementById('adminModal').style.display = 'none';
    }

    async function searchYoutube() {
      const query = document.getElementById('searchInput').value.trim();
      const grid = document.getElementById('resultsGrid');
      if (!query) return;

      grid.innerHTML = '<p style="color:#b3b3b3;">מחפש שירים...</p>';
      showSection('results');

      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=8&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`);
        const data = await res.json();

        if (!data.items || data.items.length === 0) {
          grid.innerHTML = '<p style="color:#b3b3b3;">לא נמצאו תוצאות.</p>';
          return;
        }

        grid.innerHTML = '';
        data.items.forEach(item => {
          const videoId = item.id.videoId;
          const title = item.snippet.title;
          const channel = item.snippet.channelTitle;
          const imgUrl = item.snippet.thumbnails.medium.url;

          const card = document.createElement('div');
          card.className = 'media-card';
          card.innerHTML = `
            <img src="${imgUrl}">
            <div class="title">${title}</div>
            <div class="sub-title">${channel}</div>
            <button class="btn-action" onclick="playSong('${videoId}', '${escapeQuotes(title)}', '${escapeQuotes(channel)}', '${imgUrl}')">הפעל</button>
            <button class="btn-action" style="background:#333; color:white" onclick="addToPlaylist('${videoId}', '${escapeQuotes(title)}', '${imgUrl}', '${escapeQuotes(channel)}')">+ פלייליסט</button>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        grid.innerHTML = '<p style="color:#ff5252;">שגיאה בטעינת התוצאות.</p>';
      }
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function playSong(id, title, artist, img) {
      document.getElementById('playerContainer').innerHTML = 
        `<iframe src="https://www.youtube.com/embed/${id}?enablejsapi=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;

      document.getElementById('barTitle').innerText = title;
      document.getElementById('barArtist').innerText = artist;
      const thumb = document.getElementById('barThumb');
      thumb.src = img;
      thumb.style.display = 'block';
    }

    function addToPlaylist(id, title, img, artist) {
      if (!myPlaylist.some(item => item.id === id)) {
        myPlaylist.push({ id, title, img, artist });
        localStorage.setItem('elim_playlist', JSON.stringify(myPlaylist));
        renderPlaylist();
      }
    }

    function renderPlaylist() {
      const grid = document.getElementById('playlistGrid');
      grid.innerHTML = '';

      if (myPlaylist.length === 0) {
        grid.innerHTML = '<p style="color:#b3b3b3;">הפלייליסט ריק.</p>';
        return;
      }

      myPlaylist.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'media-card';
        card.innerHTML = `
          <img src="${item.img}">
          <div class="title">${item.title}</div>
          <div class="sub-title">${item.artist}</div>
          <button class="btn-action" onclick="playSong('${item.id}', '${escapeQuotes(item.title)}', '${escapeQuotes(item.artist)}', '${item.img}')">הפעל</button>
          <button class="btn-action" style="background:#ff5252; color:white" onclick="removeFromPlaylist(${index})">הסר</button>
        `;
        grid.appendChild(card);
      });
    }

    function removeFromPlaylist(index) {
      myPlaylist.splice(index, 1);
      localStorage.setItem('elim_playlist', JSON.stringify(myPlaylist));
      renderPlaylist();
    }

    function showSection(section) {
      document.getElementById('resultsSection').style.display = section === 'results' ? 'block' : 'none';
      document.getElementById('playlistSection').style.display = section === 'playlist' ? 'block' : 'none';
    }

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') searchYoutube();
    });

    renderPlaylist();
  </script>
</body>
</html>
