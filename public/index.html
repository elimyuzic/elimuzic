<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Elimusic</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <link rel="icon" type="image/png" href="icon.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      background-color: #121212; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; }

    /* Top Bar */
    .top-bar {
      height: 52px; background-color: #121212;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; border-bottom: 1px solid #282828; z-index: 10;
    }
    .brand-logo-container { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .brand-logo-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .brand-logo-text { color: #1db954; font-size: 1rem; font-weight: 800; }

    .search-container {
      display: flex; align-items: center; background-color: #242424;
      border-radius: 50px; padding: 4px 10px; flex: 1; max-width: 200px; margin: 0 8px;
    }
    .search-container input {
      background: transparent; border: none; color: #ffffff;
      width: 100%; outline: none; padding-right: 4px; font-size: 0.8rem;
    }
    .search-btn {
      background: #1db954; border: none; color: black;
      border-radius: 20px; padding: 4px 8px; font-weight: bold; cursor: pointer; font-size: 0.75rem;
    }

    /* Content Area */
    .content-area {
      flex: 1; background: linear-gradient(to bottom, #1e1e1e, #121212);
      padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 130px;
    }

    .player-view {
      width: 100%; height: 180px; background: #000;
      border-radius: 8px; overflow: hidden; position: relative;
    }
    #ytPlayer { width: 100%; height: 100%; }

    .player-placeholder {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #181818; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #b3b3b3; z-index: 5; text-align: center;
    }

    .ad-banner {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
    }
    .ad-banner img { max-width: 90%; max-height: 80%; object-fit: contain; }

    .grid-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px;
    }
    .media-card {
      background-color: #181818; padding: 8px; border-radius: 8px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .media-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
    .media-card.artist-card img { border-radius: 50%; }
    .media-card .title { font-size: 0.8rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .media-card .sub-title { font-size: 0.7rem; color: #b3b3b3; }

    .btn-action {
      background-color: #1db954; border: none; color: black;
      font-weight: bold; padding: 6px; border-radius: 12px; cursor: pointer; font-size: 0.75rem; text-align: center;
    }

    /* Modals & Overlays */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 1000; display: none;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal {
      background: #282828; padding: 20px; border-radius: 12px;
      width: 100%; max-width: 360px; border: 1px solid #1db954; color: white;
      max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { margin-bottom: 12px; color: #1db954; text-align: center; font-size: 1.4rem; }
    .modal label { font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 4px; color: #ddd; }
    
    .file-input-box {
      background: #181818; border: 1px solid #444; border-radius: 6px; padding: 8px; margin-bottom: 12px;
    }
    .file-input-box input[type="file"] { width: 100%; color: #aaa; font-size: 0.8rem; }
    
    .modal input[type="text"], .modal select {
      width: 100%; padding: 10px; margin-bottom: 12px;
      background: #181818; border: 1px solid #444; color: white; border-radius: 6px; outline: none;
    }

    .btn-save-ad {
      width: 100%; background: #1db954; color: black; font-weight: bold;
      padding: 12px; border: none; border-radius: 25px; cursor: pointer; font-size: 0.9rem; margin-bottom: 12px;
    }
    .btn-add-subscriber {
      width: 100%; background: #007afe; color: white; font-weight: bold;
      padding: 12px; border: none; border-radius: 25px; cursor: pointer; font-size: 0.9rem; margin-bottom: 12px;
    }
    .btn-close-modal {
      width: 100%; background: #555; color: white; font-weight: bold;
      padding: 10px; border: none; border-radius: 25px; cursor: pointer; font-size: 0.85rem;
    }

    .item-list { margin-bottom: 12px; background: #181818; border-radius: 6px; padding: 6px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 6px; border-bottom: 1px solid #333; font-size: 0.8rem; }
    .item-row:last-child { border-bottom: none; }
    .btn-del-item { background: #ff5252; color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 0.75rem; }

    /* Toast Notification */
    #toast {
      position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
      background-color: #1db954; color: black; font-weight: bold;
      padding: 10px 20px; border-radius: 20px; z-index: 9999;
      display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Bottom Player Bar */
    .spotify-player-bar {
      position: fixed; bottom: 56px; left: 0; right: 0; height: 56px;
      background-color: #282828; border-radius: 8px 8px 0 0;
      display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 90; margin: 0 4px;
    }
    .now-playing { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .now-playing img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; background: #121212; }
    .track-info { display: flex; flex-direction: column; overflow: hidden; }
    .track-info .track-title { font-size: 0.8rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-info .track-artist { font-size: 0.7rem; color: #b3b3b3; }

    /* Bottom Nav Bar */
    .spotify-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
      background-color: #000000; display: flex; justify-content: space-around; align-items: center;
      border-top: 1px solid #181818; z-index: 100;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: #b3b3b3; background: none; border: none; font-size: 0.65rem; cursor: pointer;
    }
    .nav-btn.active { color: #ffffff; }
    .nav-btn svg { width: 20px; height: 20px; fill: currentColor; }
  </style>
</head>
<body>

  <!-- Toast Notification -->
  <div id="toast">נוסף לפלייליסט</div>

  <!-- Gate Overlay -->
  <div class="modal-overlay" id="gateOverlay" style="display: flex;">
    <div class="modal">
      <h3>ברוכים הבאים ל-Elimusic</h3>
      <p style="font-size: 0.8rem; color: #b3b3b3; margin-bottom: 12px; text-align: center;">הכנס שם משתמש לכניסה</p>
      <input type="text" id="loginUsername" placeholder="שם משתמש">
      <button class="search-btn" style="width: 100%; padding: 10px;" onclick="login()">התחבר</button>
    </div>
  </div>

  <!-- Add to Playlist Modal -->
  <div class="modal-overlay" id="addToPlaylistModal">
    <div class="modal">
      <h3>בחר פלייליסט</h3>
      <select id="playlistSelect"></select>
      <button class="search-btn" style="width: 100%; margin-bottom: 8px;" onclick="confirmAddToPlaylist()">אישור</button>
      <button class="search-btn" style="width: 100%; background: #444; color: white;" onclick="closePlaylistModal()">ביטול</button>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand-logo-container" onclick="handleLogoClick()">
      <img src="icon.png" alt="Logo" class="brand-logo-img" onerror="this.style.display='none'">
      <span class="brand-logo-text">Elimusic</span>
    </div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="חפש שיר...">
      <button class="search-btn" onclick="triggerSearch()">חפש</button>
    </div>
    <button class="search-btn" style="background:#333; color:white; padding: 4px 8px;" onclick="logout()">יציאה</button>
  </div>

  <div class="content-area">
    <div class="player-view">
      <div class="player-placeholder" id="playerPlaceholder">
        <svg style="width:40px; height:40px; fill:#1db954; margin-bottom:8px;" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <span>חפש ובחר שיר להשמעה</span>
      </div>
      <div id="ytPlayer"></div>
      <div class="ad-banner" id="adBanner">
        <h4 style="color:#1db954; margin-bottom:8px;">פרסומת</h4>
        <img id="adImage" src="" alt="פרסומת">
        <audio id="adAudio" style="display:none;"></audio>
      </div>
    </div>

    <!-- Results Section -->
    <div id="resultsSection">
      <h4 id="resultsTitle" style="margin-bottom: 8px;">תוצאות</h4>
      <div class="grid-container" id="resultsGrid"></div>
    </div>

    <!-- Playlist Section -->
    <div id="playlistSection" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h4>הפלייליסטים שלי</h4>
        <button class="search-btn" onclick="createNewPlaylist()">+ פלייליסט חדש</button>
      </div>
      <div id="playlistsContainer"></div>
    </div>
  </div>

  <!-- Bottom Player -->
  <div class="spotify-player-bar">
    <div class="now-playing">
      <img id="barThumb" src="" alt="" style="display:none;">
      <div class="track-info">
        <div class="track-title" id="barTitle">אין שיר מופעל</div>
        <div class="track-artist" id="barArtist">בחר שיר להשמעה</div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="spotify-nav">
    <button class="nav-btn active" id="navHomeBtn" onclick="setActiveNav('navHomeBtn'); showSection('results');">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>בית</span>
    </button>
    <button class="nav-btn" id="navSearchBtn" onclick="setActiveNav('navSearchBtn'); focusSearch('song');">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>חיפוש</span>
    </button>
    <button class="nav-btn" id="navLibraryBtn" onclick="setActiveNav('navLibraryBtn'); showSection('playlist');">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      <span>הספריה שלי</span>
    </button>
    <button class="nav-btn" id="navArtistBtn" onclick="setActiveNav('navArtistBtn'); focusSearch('artist');">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>אמן</span>
    </button>
  </nav>

  <!-- Admin Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal">
      <h3>פאנל מנהל</h3>
      
      <label>העלאת תמונת פרסומת:</label>
      <div class="file-input-box">
        <input type="file" id="adImgInput" accept="image/*">
      </div>

      <label>העלאת שמע פרסומת:</label>
      <div class="file-input-box">
        <input type="file" id="adAudioInput" accept="audio/*">
      </div>

      <button class="btn-save-ad" onclick="saveAdGlobally()">שמור פרסומת</button>

      <div id="adsListContainer" class="item-list"></div>

      <hr style="border: 0; border-top: 1px solid #444; margin: 12px 0;">

      <label>הוספת מנוי פרימיום:</label>
      <input type="text" id="subUsernameInput" placeholder="שם משתמש">

      <button class="btn-add-subscriber" onclick="addSubscriber()">הוסף מנוי</button>

      <div id="subsListContainer" class="item-list"></div>

      <button class="btn-close-modal" onclick="closeAdmin()">סגור</button>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const YOUTUBE_API_KEY = 'AIzaSyDciIRdNamQuthn579qKWTM9CqXSyQzO7c';
    let player, selectedTrackForPlaylist = null;
    let playlists = JSON.parse(localStorage.getItem('elim_playlists_v2')) || { 'הפלייליסט שלי': [] };
    let globalAds = JSON.parse(localStorage.getItem('elim_ads_list')) || [];
    let subscribers = JSON.parse(localStorage.getItem('elim_subscribers_list')) || [];
    let currentSearchMode = 'song';
    
    let logoClickCount = 0;
    let logoClickTimer;

    function handleLogoClick() {
      logoClickCount++;
      clearTimeout(logoClickTimer);
      logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 3000);

      if (logoClickCount === 6) {
        logoClickCount = 0;
        const pass = prompt('הכנס סיסמת מנהל:');
        if (pass === '1059') {
          renderAdminLists();
          document.getElementById('adminModal').style.display = 'flex';
        } else if (pass !== null) {
          alert('סיסמה שגויה!');
        }
      }
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('ytPlayer', {
        height: '100%', width: '100%',
        playerVars: { 'autoplay': 1, 'controls': 1, 'playsinline': 1 }
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    function setActiveNav(btnId) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(btnId).classList.add('active');
    }

    function createNewPlaylist() {
      const name = prompt('הכנס שם לפלייליסט החדש:');
      if (name && !playlists[name]) {
        playlists[name] = [];
        savePlaylists();
        renderPlaylists();
      }
    }

    function savePlaylists() {
      localStorage.setItem('elim_playlists_v2', JSON.stringify(playlists));
    }

    function openAddToPlaylistModal(track) {
      selectedTrackForPlaylist = track;
      const select = document.getElementById('playlistSelect');
      select.innerHTML = '';
      Object.keys(playlists).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.innerText = name;
        select.appendChild(opt);
      });
      document.getElementById('addToPlaylistModal').style.display = 'flex';
    }

    function closePlaylistModal() {
      document.getElementById('addToPlaylistModal').style.display = 'none';
    }

    function confirmAddToPlaylist() {
      const playlistName = document.getElementById('playlistSelect').value;
      if (playlistName && selectedTrackForPlaylist) {
        if (!playlists[playlistName].some(t => t.id === selectedTrackForPlaylist.id)) {
          playlists[playlistName].push(selectedTrackForPlaylist);
          savePlaylists();
          renderPlaylists();
          showToast('נוסף לפלייליסט');
        }
      }
      closePlaylistModal();
    }

    function renderPlaylists() {
      const container = document.getElementById('playlistsContainer');
      container.innerHTML = '';

      Object.keys(playlists).forEach(pName => {
        const group = document.createElement('div');
        group.style.marginBottom = '20px';
        group.innerHTML = `<h5 style="color:#1db954; margin-bottom:8px;">${pName}</h5>`;
        
        const grid = document.createElement('div');
        grid.className = 'grid-container';

        if (playlists[pName].length === 0) {
          grid.innerHTML = '<p style="color:#888; font-size:0.8rem;">אין שירים בפלייליסט זה</p>';
        } else {
          playlists[pName].forEach((item, idx) => {
            const card = document.createElement('div');
            card.className = 'media-card';
            card.innerHTML = `
              <img src="${item.img}">
              <div class="title">${item.title}</div>
              <div class="sub-title">${item.artist}</div>
              <button class="btn-action" onclick="playSong('${item.id}', '${escapeQuotes(item.title)}', '${escapeQuotes(item.artist)}', '${item.img}')">הפעל</button>
              <button class="btn-action" style="background:#ff5252; color:white;" onclick="removeFromPlaylist('${pName}', ${idx})">הסר</button>
            `;
            grid.appendChild(card);
          });
        }
        group.appendChild(grid);
        container.appendChild(group);
      });
    }

    function removeFromPlaylist(pName, index) {
      playlists[pName].splice(index, 1);
      savePlaylists();
      renderPlaylists();
    }

    function triggerSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      if (currentSearchMode === 'artist') {
        searchChannels(query);
      } else {
        searchYoutube(query);
      }
    }

    async function searchYoutube(query) {
      const grid = document.getElementById('resultsGrid');
      document.getElementById('resultsTitle').innerText = 'תוצאות שירים';
      grid.innerHTML = '<p style="color:#b3b3b3;">מחפש שירים...</p>';
      showSection('results');

      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`);
        const data = await res.json();
        grid.innerHTML = '';

        if (!data.items || data.items.length === 0) {
          grid.innerHTML = '<p style="color:#b3b3b3;">לא נמצאו תוצאות.</p>';
          return;
        }

        data.items.forEach(item => {
          const videoId = item.id.videoId;
          const title = item.snippet.title;
          const channel = item.snippet.channelTitle;
          const imgUrl = item.snippet.thumbnails.medium.url;

          const card = document.createElement('div');
          card.className = 'media-card';
          card.innerHTML = `
            <img src="${imgUrl}">
            <div class="title">${title}</div>
            <div class="sub-title">${channel}</div>
            <button class="btn-action" onclick="playSong('${videoId}', '${escapeQuotes(title)}', '${escapeQuotes(channel)}', '${imgUrl}')">הפעל</button>
            <button class="btn-action" style="background:#333; color:white;" onclick="openAddToPlaylistModal({id:'${videoId}', title:'${escapeQuotes(title)}', artist:'${escapeQuotes(channel)}', img:'${imgUrl}'})">+ פלייליסט</button>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        grid.innerHTML = '<p style="color:#ff5252;">שגיאה בטעינה.</p>';
      }
    }

    async function searchChannels(query) {
      const grid = document.getElementById('resultsGrid');
      document.getElementById('resultsTitle').innerText = 'תוצאות אמנים';
      grid.innerHTML = '<p style="color:#b3b3b3;">מחפש אמנים וערוצים...</p>';
      showSection('results');

      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(query)}&type=channel&key=${YOUTUBE_API_KEY}`);
        const data = await res.json();
        grid.innerHTML = '';

        if (!data.items || data.items.length === 0) {
          grid.innerHTML = '<p style="color:#b3b3b3;">לא נמצאו ערוצים.</p>';
          return;
        }

        const mainImg = data.items[0].snippet.thumbnails.medium ? data.items[0].snippet.thumbnails.medium.url : '';

        const aggregatedCard = document.createElement('div');
        aggregatedCard.className = 'media-card artist-card';
        aggregatedCard.style.gridColumn = '1 / -1';
        aggregatedCard.style.padding = '16px';
        aggregatedCard.style.textAlign = 'center';

        aggregatedCard.innerHTML = `
          <img src="${mainImg}" style="width: 100px; height: 100px; margin: 0 auto 10px auto; display: block;">
          <div class="title" style="font-size: 1.1rem; margin-bottom: 4px;">${query}</div>
          <div class="sub-title" style="margin-bottom: 12px; color: #1db954;">נמצאו מספר ערוצים משוייכים</div>
          <button class="btn-action" style="padding: 10px 20px; font-size: 0.9rem; width: 100%; max-width: 250px; margin: 0 auto;" onclick="searchYoutube('${escapeQuotes(query)}')">
            לחבר הכל - הצג את כל השירים
          </button>
        `;
        
        grid.appendChild(aggregatedCard);

      } catch (e) {
        grid.innerHTML = '<p style="color:#ff5252;">שגיאה בטעינת נתוני האמן.</p>';
      }
    }

    function playSong(id, title, artist, img) {
      document.getElementById('playerPlaceholder').style.display = 'none';
      if (player && player.loadVideoById) player.loadVideoById(id);
      document.getElementById('barTitle').innerText = title;
      document.getElementById('barArtist').innerText = artist;
      const thumb = document.getElementById('barThumb');
      thumb.src = img; thumb.style.display = 'block';
    }

    /* Admin Management */
    function saveAdGlobally() {
      const imgFile = document.getElementById('adImgInput').files[0];
      const audioFile = document.getElementById('adAudioInput').files[0];

      if (!imgFile) {
        alert('יש לבחור קובץ תמונה לפרסומת');
        return;
      }

      const readerImg = new FileReader();
      readerImg.onload = function(eImg) {
        const adData = { id: Date.now(), img: eImg.target.result };

        if (audioFile) {
          const readerAudio = new FileReader();
          readerAudio.onload = function(eAudio) {
            adData.audio = eAudio.target.result;
            globalAds.push(adData);
            localStorage.setItem('elim_ads_list', JSON.stringify(globalAds));
            alert('הפרסומת נשמרה בהצלחה!');
            clearAdInputs();
            renderAdminLists();
          };
          readerAudio.readAsDataURL(audioFile);
        } else {
          globalAds.push(adData);
          localStorage.setItem('elim_ads_list', JSON.stringify(globalAds));
          alert('הפרסומת נשמרה בהצלחה!');
          clearAdInputs();
          renderAdminLists();
        }
      };
      readerImg.readAsDataURL(imgFile);
    }

    function clearAdInputs() {
      document.getElementById('adImgInput').value = '';
      document.getElementById('adAudioInput').value = '';
    }

    function deleteAd(id) {
      globalAds = globalAds.filter(ad => ad.id !== id);
      localStorage.setItem('elim_ads_list', JSON.stringify(globalAds));
      renderAdminLists();
    }

    function addSubscriber() {
      const username = document.getElementById('subUsernameInput').value.trim();
      if (!username) {
        alert('יש להכניס שם משתמש');
        return;
      }

      if (!subscribers.includes(username)) {
        subscribers.push(username);
        localStorage.setItem('elim_subscribers_list', JSON.stringify(subscribers));
        alert(`המנוי ${username} נוסף בהצלחה!`);
        document.getElementById('subUsernameInput').value = '';
        renderAdminLists();
      } else {
        alert('משתמש זה כבר קיים ברשימת המנויים');
      }
    }

    function deleteSubscriber(name) {
      subscribers = subscribers.filter(s => s !== name);
      localStorage.setItem('elim_subscribers_list', JSON.stringify(subscribers));
      renderAdminLists();
    }

    function renderAdminLists() {
      const adsContainer = document.getElementById('adsListContainer');
      if (globalAds.length === 0) {
        adsContainer.innerHTML = '<p style="font-size:0.75rem; color:#888;">אין פרסומות שמורות</p>';
      } else {
        adsContainer.innerHTML = '<strong style="font-size:0.8rem; display:block; margin-bottom:4px;">פרסומות קיימות (' + globalAds.length + '):</strong>';
        globalAds.forEach((ad, i) => {
          const row = document.createElement('div');
          row.className = 'item-row';
          row.innerHTML = `
            <span>פרסומת #${i+1} ${ad.audio ? '(עם שמע)' : ''}</span>
            <button class="btn-del-item" onclick="deleteAd(${ad.id})">מחק</button>
          `;
          adsContainer.appendChild(row);
        });
      }

      const subsContainer = document.getElementById('subsListContainer');
      if (subscribers.length === 0) {
        subsContainer.innerHTML = '<p style="font-size:0.75rem; color:#888;">אין מנויי פרימיום</p>';
      } else {
        subsContainer.innerHTML = '<strong style="font-size:0.8rem; display:block; margin-bottom:4px;">מנויים קיימים (' + subscribers.length + '):</strong>';
        subscribers.forEach(sub => {
          const row = document.createElement('div');
          row.className = 'item-row';
          row.innerHTML = `
            <span>${sub}</span>
            <button class="btn-del-item" onclick="deleteSubscriber('${sub}')">מחק</button>
          `;
          subsContainer.appendChild(row);
        });
      }
    }

    function escapeQuotes(str) { return str.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
    function login() { document.getElementById('gateOverlay').style.display = 'none'; }
    function logout() { document.getElementById('gateOverlay').style.display = 'flex'; }
    function showSection(sec) {
      document.getElementById('resultsSection').style.display = sec === 'results' ? 'block' : 'none';
      document.getElementById('playlistSection').style.display = sec === 'playlist' ? 'block' : 'none';
    }
    
    function focusSearch(mode) {
      currentSearchMode = mode;
      showSection('results');
      const input = document.getElementById('searchInput');
      input.placeholder = mode === 'artist' ? 'חפש אמן/ערוץ...' : 'חפש שיר...';
      input.focus();
    }
    
    function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }

    document.addEventListener('DOMContentLoaded', renderPlaylists);
  </script>
</body>
</html>
