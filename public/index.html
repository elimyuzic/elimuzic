<script>
  // רשימת שירים (מאורגנת לפי אמנים)
  const songs = [
    { id: 1, title: "שיר א'1", artist: "אמן א'", src: "[https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3](https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3)", cover: "[https://via.placeholder.com/40/1DB954/ffffff](https://via.placeholder.com/40/1DB954/ffffff)" },
    { id: 2, title: "שיר א'2", artist: "אמן א'", src: "[https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3](https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3)", cover: "[https://via.placeholder.com/40/1DB954/ffffff](https://via.placeholder.com/40/1DB954/ffffff)" },
    { id: 3, title: "שיר ב'1", artist: "אמן ב'", src: "[https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3](https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3)", cover: "[https://via.placeholder.com/40/333333/ffffff](https://via.placeholder.com/40/333333/ffffff)" },
    { id: 4, title: "שיר ב'2", artist: "אמן ב'", src: "[https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3](https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3)", cover: "[https://via.placeholder.com/40/333333/ffffff](https://via.placeholder.com/40/333333/ffffff)" }
  ];

  let currentSongIndex = -1;
  const audio = document.getElementById('audio-player');
  const playBtn = document.getElementById('play-btn');

  // טעינת רשימת השירים למסך
  const playlistContainer = document.getElementById('playlist');
  songs.forEach((song, index) => {
    const card = document.createElement('div');
    card.className = 'song-card';
    card.innerHTML = `
      <img src="${song.cover}" alt="cover">
      <div>
        <div><strong>${song.title}</strong></div>
        <div style="font-size: 12px; color: #b3b3b3;">${song.artist}</div>
      </div>
    `;
    card.onclick = () => playSong(index);
    playlistContainer.appendChild(card);
  });

  // הפעלת שיר לפי אינדקס
  function playSong(index) {
    currentSongIndex = index;
    const song = songs[currentSongIndex];
    
    audio.src = song.src;
    document.getElementById('current-title').innerText = song.title;
    document.getElementById('current-artist').innerText = song.artist;
    document.getElementById('current-cover').src = song.cover;
    
    audio.play();
    playBtn.innerText = '⏸';
  }

  // שליטה בלחיצה על כפתור הפעלה/השהיה
  playBtn.onclick = () => {
    if (audio.paused) {
      if (currentSongIndex === -1) playSong(0);
      else {
        audio.play();
        playBtn.innerText = '⏸';
      }
    } else {
      audio.pause();
      playBtn.innerText = '▶';
    }
  };

  // מעבר אוטומטי לשיר הבא של אותו אמן כשהשיר מסתיים
  audio.onended = () => {
    const currentArtist = songs[currentSongIndex].artist;
    
    // מציאת השיר הבא ברשימה של אותו אמן
    let nextIndex = songs.findIndex((song, idx) => idx > currentSongIndex && song.artist === currentArtist);
    
    // אם לא נמצא שיר בהמשך, מחפשים את השיר הראשון של אותו אמן (בלולאה)
    if (nextIndex === -1) {
      nextIndex = songs.findIndex(song => song.artist === currentArtist);
    }

    if (nextIndex !== -1) {
      playSong(nextIndex);
    }
  };
</script>
