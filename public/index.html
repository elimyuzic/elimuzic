<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELIMYUZIC - Spotify Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      height: 60px;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid #282828;
    }

    .brand-logo {
      color: #1db954;
      font-size: 1.5rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      letter-spacing: 1px;
    }

    .search-container {
      display: flex;
      align-items: center;
      background-color: #242424;
      border-radius: 50px;
      padding: 6px 16px;
      width: 360px;
      border: 1px solid transparent;
    }

    .search-container:focus-within {
      border-color: #ffffff;
    }

    .search-container input {
      background: transparent;
      border: none;
      color: #ffffff;
      width: 100%;
      outline: none;
      font-size: 0.9rem;
      padding-right: 8px;
    }

    .search-btn {
      background: #1db954;
      border: none;
      color: black;
      border-radius: 20px;
      padding: 6px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Main Layout */
    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background-color: #121212;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .nav-item {
      color: #b3b3b3;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      color: #ffffff;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      background: linear-gradient(to bottom, #1e1e1e, #121212);
      padding: 24px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 1.4rem;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .media-card {
      background-color: #181818;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .media-card:hover {
      background-color: #282828;
    }

    .media-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
    }

    .media-card .title {
      font-size: 0.95rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-card .sub-title {
      font-size: 0.8rem;
      color: #b3b3b3;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 5px;
    }

    .btn-action {
      flex: 1;
      background-color: #1db954;
      border: none;
      color: black;
      font-weight: bold;
      padding: 6px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    /* Player Footer */
    .player-bar {
      height: 90px;
      background-color: #000000;
      border-top: 1px solid #282828;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .iframe-container {
      width: 320px;
      height: 70px;
      border-radius: 8px;
      overflow: hidden;
      background: #181818;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Admin Panel */
    #adminModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #282828;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 1000;
      width: 320px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 999;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand-logo" id="logoHeader" onclick="handleSecretClick()">ELIMYUZIC</div>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="מה ברצונך להשמיע?">
      <button class="search-btn" onclick="searchYoutube()">חפש</button>
    </div>
    <div></div>
  </div>

  <!-- Main View -->
  <div class="main-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="nav-item active" onclick="showSection('results')"> תוצאות חיפוש</div>
      <div class="nav-item" onclick="showSection('playlist')"> הפלייליסט שלי</div>
    </div>

    <!-- Main Content -->
    <div class="content-area">
      <div id="resultsSection">
        <h2 class="section-title">תוצאות מוזיקה</h2>
        <div class="grid-container" id="resultsGrid">
          <p style="color: #b3b3b3;">הקלד שם שיר או אמן בתיבת החיפוש למעלה.</p>
        </div>
      </div>

      <div id="playlistSection" style="display: none;">
        <h2 class="section-title">הפלייליסט שלי</h2>
        <div class="grid-container" id="playlistGrid"></div>
      </div>
    </div>
  </div>

  <!-- Sticky Player -->
  <div class="player-bar">
    <div id="playerTitle" style="font-size: 0.9rem; color: #b3b3b3;">לא מושמע שיר כרגע</div>
    <div class="iframe-container" id="playerBox">
      <div style="color: #535353; text-align: center; line-height: 70px;">נגן דממה</div>
    </div>
  </div>

  <!-- Admin Panel Overlay -->
  <div class="modal-overlay" id="overlay" onclick="closeAdmin()"></div>
  <div id="adminModal">
    <h3 style="margin-bottom: 12px; color: #1db954;">פאנל מנהל</h3>
    <input type="file" id="adFileInput" accept="image/*" style="margin-bottom: 12px; width: 100%;">
    <button class="search-btn" style="width: 100%;" onclick="uploadAd()">העלה פרסומת</button>
    <div id="adminStatus" style="margin-top: 10px; font-size: 0.8rem; color: #b3b3b3;"></div>
  </div>

  <script>
    const YOUTUBE_API_KEY = 'AIzaSyDciIRdNamQuthn579qKWTM9CqXSyQzO7c';
    let clickCount = 0;
    let clickTimer = null;
    let adminToken = '';
    let myPlaylist = JSON.parse(localStorage.getItem('elim_playlist')) || [];

    // 6 לחיצות נסתרות על הלוגו למעלה
    function handleSecretClick() {
      clickCount++;
      clearTimeout(clickTimer);

      if (clickCount === 6) {
        clickCount = 0;
        const code = prompt('הכנס קוד מנהל:');
        if (code === '1059') {
          adminToken = code;
          document.getElementById('adminModal').style.display = 'block';
          document.getElementById('overlay').style.display = 'block';
        } else if (code) {
          alert('קוד שגוי');
        }
      } else {
        clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
      }
    }

    function closeAdmin() {
      document.getElementById('adminModal').style.display = 'none';
      document.getElementById('overlay').style.display = 'none';
    }

    // חיפוש ביוטיוב
    async function searchYoutube() {
      const query = document.getElementById('searchInput').value.trim();
      const grid = document.getElementById('resultsGrid');

      if (!query) return;

      grid.innerHTML = '<p style="color:#b3b3b3;">מחפש שירים...</p>';
      showSection('results');

      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=8&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`);
        const data = await res.json();

        if (!data.items || data.items.length === 0) {
          grid.innerHTML = '<p style="color:#b3b3b3;">לא נמצאו תוצאות.</p>';
          return;
        }

        grid.innerHTML = '';
        data.items.forEach(item => {
          const videoId = item.id.videoId;
          const title = item.snippet.title;
          const channel = item.snippet.channelTitle;
          const imgUrl = item.snippet.thumbnails.medium.url;

          const card = document.createElement('div');
          card.className = 'media-card';
          card.innerHTML = `
            <img src="${imgUrl}" alt="${title}">
            <div class="title" title="${title}">${title}</div>
            <div class="sub-title">${channel}</div>
            <div class="card-actions">
              <button class="btn-action" onclick="playSong('${videoId}', '${escapeQuotes(title)}')">הפעל</button>
              <button class="btn-action" style="background:#333; color:white" onclick="addToPlaylist('${videoId}', '${escapeQuotes(title)}', '${imgUrl}', '${escapeQuotes(channel)}')">+ פלייליסט</button>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        grid.innerHTML = '<p style="color:#ff5252;">שגיאה בחיבור לשרת החיפוש.</p>';
      }
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function playSong(id, title) {
      document.getElementById('playerTitle').innerText = title;
      document.getElementById('playerBox').innerHTML = 
        `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    }

    function addToPlaylist(id, title, img, channel) {
      if (!myPlaylist.some(item => item.id === id)) {
        myPlaylist.push({ id, title, img, channel });
        localStorage.setItem('elim_playlist', JSON.stringify(myPlaylist));
        renderPlaylist();
      }
    }

    function renderPlaylist() {
      const grid = document.getElementById('playlistGrid');
      grid.innerHTML = '';

      if (myPlaylist.length === 0) {
        grid.innerHTML = '<p style="color:#b3b3b3;">הפלייליסט ריק.</p>';
        return;
      }

      myPlaylist.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'media-card';
        card.innerHTML = `
          <img src="${item.img}" alt="${item.title}">
          <div class="title" title="${item.title}">${item.title}</div>
          <div class="sub-title">${item.channel}</div>
          <div class="card-actions">
            <button class="btn-action" onclick="playSong('${item.id}', '${escapeQuotes(item.title)}')">הפעל</button>
            <button class="btn-action" style="background:#ff5252; color:white" onclick="removeFromPlaylist(${index})">הסר</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function removeFromPlaylist(index) {
      myPlaylist.splice(index, 1);
      localStorage.setItem('elim_playlist', JSON.stringify(myPlaylist));
      renderPlaylist();
    }

    function showSection(section) {
      document.getElementById('resultsSection').style.display = section === 'results' ? 'block' : 'none';
      document.getElementById('playlistSection').style.display = section === 'playlist' ? 'block' : 'none';
    }

    async function uploadAd() {
      const fileInput = document.getElementById('adFileInput');
      const status = document.getElementById('adminStatus');

      if (!fileInput.files[0]) {
        status.innerText = 'יש לבחור קובץ';
        return;
      }

      const formData = new FormData();
      formData.append('adminCode', adminToken);
      formData.append('adFile', fileInput.files[0]);

      try {
        const res = await fetch('/api/admin/upload-ad', { method: 'POST', body: formData });
        const data = await res.json();
        status.innerText = data.success ? 'הועלה בהצלחה!' : 'שגיאה בהעלאה';
      } catch (e) {
        status.innerText = 'שגיאה בתקשורת';
      }
    }

    // Enter Key Search Trigger
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') searchYoutube();
    });

    renderPlaylist();
  </script>
</body>
</html>
